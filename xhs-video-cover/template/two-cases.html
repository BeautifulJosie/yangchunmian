<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>模板：两个案例</title>
<style>
:root{
  --accent:#2C6E80;   /* 主色：竖条、副标题、括号、&、斜色带、第二个标签 */
  --font:'Noto Sans CJK SC','Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif;
}
body{margin:0;background:#E3EAED}
</style>
</head>
<body>
<div id="cover" style="width: 1080px; height: 1440px; position: relative; overflow: hidden; background: #E3EAED; font-family: var(--font); color: #101A20">

  <!-- topo lines -->
  <svg width="1080" height="1440" viewBox="0 0 1080 1440" style="position: absolute; left: 0; top: 0" aria-hidden="true">
    <g fill="none" stroke="#C9D6DB" stroke-width="2">
      <path d="M-40 120 C200 60 380 190 620 120 S980 40 1120 110"></path>
      <path d="M-40 170 C220 110 400 240 640 170 S990 90 1120 160"></path>
      <path d="M-40 560 C160 500 360 610 560 540 S900 470 1120 540"></path>
      <path d="M-40 610 C180 550 380 660 580 590 S920 520 1120 590"></path>
      <path d="M700 300 C820 260 980 300 1120 260"></path>
      <path d="M680 350 C820 310 990 350 1120 310"></path>
    </g>
    <path d="M560 470 C760 420 940 370 1120 300 L1120 350 C940 420 780 468 580 510Z" fill="var(--accent)" opacity="0.85"></path>
  </svg>

  <!-- play button -->
  <svg width="104" height="104" viewBox="0 0 104 104" style="position: absolute; right: 64px; top: 200px" aria-hidden="true">
    <circle cx="52" cy="52" r="50" fill="#9AA6AB" opacity="0.9"></circle>
    <path d="M42 32 L74 52 L42 72Z" fill="#FFFFFF"></path>
  </svg>

  <!-- headline block -->
  <div style="position: absolute; left: 72px; top: 76px; width: 960px; display: flex; flex-direction: column; gap: 22px">
    <div style="display: flex; gap: 28px; align-items: stretch">
      <div style="width: 10px; background: var(--accent); border-radius: 2px"></div>
      <h1 style="margin: 0; font-size: 100px; line-height: 1.18; font-weight: 900; letter-spacing: 1px; white-space: nowrap; color: #101A20">用 AI 做旅行网页<br>过程实录</h1>
    </div>
    <div style="padding-left: 38px; display: flex; flex-direction: column; gap: 10px">
      <div style="font-size: 56px; font-weight: 700; color: var(--accent)">手把手展示两个案例</div>
      <div style="display: flex; align-items: flex-start; gap: 18px; margin-top: 6px">
        <div style="position: relative; padding: 12px 26px; font-size: 38px; font-weight: 700; color: #1F4F5E">
          <span style="position: absolute; left: 0; top: -4px; font-size: 34px; font-weight: 700; color: var(--accent)">(</span>
          周末洛杉矶一日游
          <span style="position: absolute; right: 0; bottom: -4px; font-size: 34px; font-weight: 700; color: var(--accent)">)</span>
        </div>
        <div style="font-size: 60px; font-weight: 900; line-height: 1; color: var(--accent); margin-top: 22px">&amp;</div>
        <div style="position: relative; padding: 12px 26px; margin-top: 40px; font-size: 38px; font-weight: 700; color: #1F4F5E">
          <span style="position: absolute; left: 0; top: -4px; font-size: 34px; font-weight: 700; color: var(--accent)">(</span>
          国庆家长的桂林行程
          <span style="position: absolute; right: 0; bottom: -4px; font-size: 34px; font-weight: 700; color: var(--accent)">)</span>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== Case 1: LA browser window ===== -->
  <div style="position: absolute; left: 44px; top: 610px; width: 640px; height: 960px; transform: rotate(-4deg); transform-origin: center; background: #FFFFFF; border-radius: 22px; box-shadow: 0 30px 60px rgba(20,40,50,0.22); overflow: hidden; display: flex; flex-direction: column">
    <div style="height: 58px; background: #F1F4F5; display: flex; align-items: center; gap: 10px; padding: 0 22px; border-bottom: 1px solid #DDE4E7">
      <div style="width: 14px; height: 14px; border-radius: 7px; background: #C9D1D4"></div>
      <div style="width: 14px; height: 14px; border-radius: 7px; background: #C9D1D4"></div>
      <div style="width: 14px; height: 14px; border-radius: 7px; background: #C9D1D4"></div>
      <div style="margin-left: 16px; flex-grow: 1; height: 32px; border-radius: 16px; background: #FFFFFF; border: 1px solid #DDE4E7; font-size: 18px; color: #5A6B73; display: flex; align-items: center; padding-left: 16px">洛杉矶一日游</div>
    </div>
    <svg width="640" height="230" viewBox="0 0 640 230" aria-hidden="true" style="display: block">
      <defs><linearGradient id="lasky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9FD3E6"></stop><stop offset="1" stop-color="#F3EBD6"></stop></linearGradient></defs>
      <rect width="640" height="230" fill="url(#lasky)"></rect>
      <circle cx="500" cy="70" r="34" fill="#F2B53A"></circle>
      <path d="M0 150 L70 110 L130 128 L200 96 L270 124 L340 104 L420 130 L500 112 L640 136 L640 230 L0 230Z" fill="#A6C1B8"></path>
      <g fill="#8AA3B1"><rect x="200" y="112" width="22" height="80"></rect><rect x="226" y="92" width="26" height="100"></rect><rect x="256" y="120" width="18" height="72"></rect></g>
      <path d="M0 186 Q200 172 420 184 L420 230 L0 230Z" fill="#7FB07A"></path>
      <path d="M400 186 Q520 176 640 182 L640 230 L390 230Z" fill="#58A9C1"></path>
      <g transform="translate(560 150)"><circle r="36" fill="none" stroke="#E3A320" stroke-width="3"></circle><path d="M-36 0 H36 M0 -36 V36 M-25 -25 L25 25 M-25 25 L25 -25" stroke="#E3A320" stroke-width="1.5"></path></g>
      <g fill="#3D7A4D" transform="translate(70 150)"><path d="M0 0 Q4 40 2 70 L8 70 Q10 40 5 0Z" fill="#7A5A3A"></path><path d="M3 0 Q-20 -12 -36 6 Q-18 -4 3 3 Q-8 -20 -3 -32 Q3 -14 6 0 Q18 -24 36 -18 Q18 -8 6 3 Q26 -2 38 12 Q18 3 3 3Z"></path></g>
      <text x="32" y="56" font-size="40" font-weight="900" fill="#10324A" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, sans-serif">洛杉矶一日游</text>
      <text x="34" y="92" font-size="20" fill="#23465F" font-family="Noto Sans CJK SC, Noto Sans SC, PingFang SC, sans-serif">9月27日 周日　市中心一路向西到海边</text>
    </svg>
    <div style="padding: 22px 26px; display: flex; flex-direction: column; gap: 18px">
      <div style="background: #16222B; color: #FFFFFF; border-radius: 18px; padding: 20px 24px; display: flex; flex-direction: column; gap: 6px">
        <div style="font-size: 18px; color: #A9BCC6">距离出发</div>
        <div style="font-size: 50px; font-weight: 900; letter-spacing: 2px">0天 09:52:13</div>
      </div>
      <div style="display: flex; justify-content: space-between; align-items: center">
        <div style="font-size: 24px; font-weight: 700">9月27日 当日行程</div>
        <div style="font-size: 22px; font-weight: 900; color: #3D7A4D">3/9</div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; gap: 16px; align-items: center; opacity: 0.45">
          <div style="width: 70px; font-size: 20px; font-weight: 700">09:45</div>
          <div style="flex-grow: 1; font-size: 22px; font-weight: 700; text-decoration: line-through">小东京 Little Tokyo</div>
          <div style="font-size: 16px; padding: 4px 12px; border-radius: 14px; background: #3D7A4D; color: #FFFFFF">已去过</div>
        </div>
        <div style="margin-left: 86px; font-size: 16px; color: #4E6578; background: #F1F5F6; border-radius: 12px; padding: 2px 12px; align-self: flex-start">开车约 15 分钟</div>
        <div style="display: flex; gap: 16px; align-items: center">
          <div style="width: 70px; font-size: 20px; font-weight: 700">13:05</div>
          <div style="flex-grow: 1; font-size: 22px; font-weight: 700">停车 Whole Foods</div>
          <div style="font-size: 16px; padding: 4px 12px; border-radius: 14px; background: #E3A320; color: #2A2000">停车点</div>
        </div>
        <div style="display: flex; gap: 16px; align-items: center">
          <div style="width: 70px; font-size: 20px; font-weight: 700">15:55</div>
          <div style="flex-grow: 1; font-size: 22px; font-weight: 700">罗迪欧大道 Rodeo Drive</div>
          <div style="font-size: 16px; padding: 4px 12px; border-radius: 14px; border: 2px solid #3D7A4D; color: #3D7A4D">打卡</div>
        </div>
        <div style="margin-left: 86px; font-size: 16px; color: #4E6578; background: #F1F5F6; border-radius: 12px; padding: 2px 12px; align-self: flex-start">开车约 30 分钟</div>
        <div style="display: flex; gap: 16px; align-items: center">
          <div style="width: 70px; font-size: 20px; font-weight: 700">17:40</div>
          <div style="flex-grow: 1; font-size: 22px; font-weight: 700">圣莫尼卡码头看日落</div>
          <div style="font-size: 16px; padding: 4px 12px; border-radius: 14px; border: 2px solid #3D7A4D; color: #3D7A4D">打卡</div>
        </div>
      </div>
    </div>
  </div>

  <!-- case 1 label -->
  <div style="position: absolute; left: 70px; top: 562px; transform: rotate(-4deg); background: #101A20; color: #FFFFFF; font-size: 30px; font-weight: 700; padding: 12px 26px; border-radius: 30px">案例 1　Claude 直接生成</div>

  <!-- ===== Case 2: Guilin phone ===== -->
  <div style="position: absolute; left: 610px; top: 660px; width: 420px; height: 900px; transform: rotate(4deg); background: #101A20; border-radius: 56px; padding: 14px; box-shadow: 0 30px 60px rgba(20,40,50,0.28)">
    <div style="width: 392px; height: 872px; background: #FBFAF4; border-radius: 44px; overflow: hidden; display: flex; flex-direction: column">
      <svg width="392" height="230" viewBox="0 0 392 230" aria-hidden="true" style="display: block">
        <rect width="392" height="230" fill="#D9ECE8"></rect>
        <path d="M0 170 Q20 60 50 170 Q70 90 100 170 Q125 40 160 170 Q180 100 210 170 Q240 30 275 170 Q300 80 330 170 Q355 60 392 170 L392 230 L0 230Z" fill="#7FAF93"></path>
        <path d="M0 180 Q40 120 80 180 Q120 110 170 180 Q220 130 260 180 Q310 120 392 180 L392 230 L0 230Z" fill="#4F8B6A"></path>
        <path d="M0 200 Q196 186 392 204 L392 230 L0 230Z" fill="#9CCBD6"></path>
        <path d="M150 204 L200 204 L192 212 L158 212Z" fill="#6B4E32"></path>
      </svg>
      <div style="padding: 22px 24px; display: flex; flex-direction: column; gap: 18px">
        <div style="font-size: 58px; font-weight: 900; line-height: 1.1; color: #1F3B2E">桂林之行</div>
        <div style="font-size: 30px; font-weight: 700; color: #3D5A48">给妈妈的行程</div>
        <div style="background: #FFFFFF; border: 3px solid #4F8B6A; border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
          <div style="font-size: 26px; color: #3D5A48; font-weight: 700">今天</div>
          <div style="height: 22px; width: 260px; border-radius: 11px; background: #DCE8E1"></div>
          <div style="height: 22px; width: 200px; border-radius: 11px; background: #DCE8E1"></div>
        </div>
        <div style="background: #FFFFFF; border: 3px solid #C9DCCF; border-radius: 22px; padding: 18px 20px; display: flex; flex-direction: column; gap: 10px">
          <div style="font-size: 26px; color: #3D5A48; font-weight: 700">明天</div>
          <div style="height: 22px; width: 240px; border-radius: 11px; background: #E6EEE9"></div>
          <div style="height: 22px; width: 180px; border-radius: 11px; background: #E6EEE9"></div>
        </div>
        <div style="height: 88px; border-radius: 24px; background: #2E6A4C; color: #FFFFFF; font-size: 34px; font-weight: 900; display: flex; align-items: center; justify-content: center">查看今天行程</div>
      </div>
    </div>
  </div>

  <!-- case 2 label -->
  <div style="position: absolute; left: 560px; top: 606px; transform: rotate(4deg); background: var(--accent); color: #FFFFFF; font-size: 30px; font-weight: 700; padding: 12px 26px; border-radius: 30px">案例 2　WorkBuddy 生成</div>

  <!-- elder-friendly callout -->
  <div style="position: absolute; left: 470px; top: 1205px; background: #FFFFFF; color: #101A20; font-size: 32px; font-weight: 900; padding: 16px 28px; border-radius: 20px; box-shadow: 0 12px 30px rgba(20,40,50,0.2); border: 3px solid #101A20; transform: rotate(-3deg)">适老化改造</div>

</div>
</body>
</html>
